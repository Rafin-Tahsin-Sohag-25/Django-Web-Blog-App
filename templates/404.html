<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <!-- Bootstrap 5.3 CSS CDN -->
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container">
        <div class="row min-vh-100 align-items-center justify-content-center text-center">
            <div class="col-md-6 col-lg-5">
                <!-- Large 404 Header text -->
                <h1 class="display-1 fw-bold text-danger">404</h1>
                
                <!-- Main Error Text -->
                <h2 class="fs-2 fw-semibold text-dark mt-3">Oops! Page not found</h2>
                
                <!-- Descriptive Subtext -->
                <p class="text-muted mt-3 mb-4">
                    The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
                </p>
                
                <!-- Action Buttons -->
                <div class="d-flex gap-2 justify-content-center">
                    <a href="/" class="btn btn-primary px-4 py-2 fw-medium">
                        Go to Homepage
                    </a>
                    <a href="/contact" class="btn btn-outline-secondary px-4 py-2 fw-medium">
                        Contact Support
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5.3 JS Bundle CDN -->
    <script src="https://jsdelivr.net"></script>
</body>
</html>
